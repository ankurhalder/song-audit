[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "songaudit"
version = "0.1.0"
description = "Open-source song audit pipeline: technical, tonal, stereo, musical and lyrical QA for any track."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankur Halder" }]
keywords = ["audio", "music", "audit", "mastering", "librosa", "fastapi", "suno", "music-qa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "librosa>=0.10.1",
  "matplotlib>=3.7",
  "pyloudnorm>=0.1.1",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "mutagen>=1.47",
]

[project.optional-dependencies]
lyrics = ["faster-whisper>=1.0"]
fetch = ["yt-dlp>=2024.4.30"]
capture = ["soundcard>=0.4.4"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
songaudit = "songaudit.cli:main"

[project.urls]
Homepage = "https://github.com/ankurhalder/song-audit"
Issues = "https://github.com/ankurhalder/song-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
songaudit = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
